# The toolkit's required check on main. Runs tests/selftest.sh on Linux:
# every script is exercised without Xcode or network, including the cases
# where a script must refuse and write nothing.

name: Self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read the code, nothing more.
permissions:
  contents: read

jobs:
  selftest:
    name: Toolkit self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolkit self-test
        run: tests/selftest.sh
